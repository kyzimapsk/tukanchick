name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # GitHub Pages раздаёт только статику; сервер мультиплеера хостится отдельно.
      # Адрес можно переопределить переменной репозитория MULTIPLAYER_URL (Settings -> Secrets and variables -> Actions).
      - run: npm run build
        env:
          MULTIPLAYER_URL: ${{ vars.MULTIPLAYER_URL || 'wss://212-113-99-61.sslip.io/exchange' }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
